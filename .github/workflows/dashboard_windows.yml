name: build-dashboard-windows

on:
  push:
    branches: [main]
    tags: ["v*"]          # contoh: v1.0.0 -> build + buat GitHub Release
  workflow_dispatch:      # bisa dijalankan manual dari tab Actions

# Diperlukan supaya job bisa membuat Release & mengunggah file .exe
permissions:
  contents: write

env:
  ENTRY: dashboard_aims.py
  APP_NAME: DashboardAimS

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name ${{ env.APP_NAME }}
          --collect-all pyqtgraph
          ${{ env.ENTRY }}

      - name: Lihat isi dist
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/*.exe
          if-no-files-found: error

      # Hanya jalan saat yang di-push adalah TAG (v*), bukan push biasa
      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.exe
          generate_release_notes: true
